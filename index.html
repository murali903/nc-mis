function createNotification(userId, indentId, message) {
    return {
        id: `notif-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
        userId,
        indentId,
        message,
        read: false,
        createdAt: new Date().toISOString()
    };
}

function createActivityLogEntry(action, by, note) {
    return {
        action,
        by,
        at: new Date().toISOString(),
        note: note || ''
    };
}

function addActivityLog(indent, action, by, note) {
    const log = indent.activityLog || [];
    return [...log, createActivityLogEntry(action, by, note)];
}

function appReducer(state, action) {
    switch (action.type) {
        case 'LOGIN_AS_USER': {
            const loginUser = typeof action.payload === 'string'
                ? state.users.find(u => u.id === action.payload)
                : action.payload;
            return { ...state, currentUserId: loginUser ? loginUser.id : null, currentUser: loginUser || null };
        }

        case 'LOGOUT':
            return { ...state, currentUserId: null, currentUser: null, currentRoute: '#login' };

        case 'NAVIGATE':
            return { ...state, currentRoute: action.payload };

        case 'CREATE_INDENT': {
            const newIndent = {
                ...action.payload,
                activityLog: action.payload.activityLog || [
                    createActivityLogEntry('Created', action.payload.createdBy, ''),
                    ...(action.payload.status === 'pending_approval'
                        ? [createActivityLogEntry('Submitted for Approval', action.payload.createdBy, '')]
                        : [])
                ]
            };
            let notificationsToAdd = [];

            if (newIndent.status === 'pending_approval') {
                const userSiteAssignments = state.siteAssignments;
                const siteAssignedPMs = Object.entries(userSiteAssignments)
                    .filter(([userId, siteIds]) => siteIds.includes(newIndent.siteId))
                    .map(([userId]) => userId)
                    .filter(userId => {
                        const user = state.users.find(u => u.id === userId);
                        return user && user.role === 'project_manager';
                    });

                const md = state.users.find(u => u.role === 'md');

                siteAssignedPMs.forEach(pmId => {
                    notificationsToAdd.push(createNotification(pmId, newIndent.id, `New indent ${newIndent.id} pending approval`));
                });

                if (md) {
                    notificationsToAdd.push(createNotification(md.id, newIndent.id, `New indent ${newIndent.id} pending approval`));
                }
            }

            return {
                ...state,
                indents: [...state.indents, newIndent],
                notifications: [...state.notifications, ...notificationsToAdd]
            };
        }

        case 'APPROVE_INDENT': {
            const indent = state.indents.find(i => i.id === action.payload.indentId);
            let notificationsToAdd = [];
            const approvedBy = action.payload.approvedBy || state.currentUserId;

            if (indent) {
                notificationsToAdd.push(createNotification(indent.createdBy, indent.id, `Indent ${indent.id} approved`));

                const procManager = state.users.find(u => u.role === 'procurement_manager');
                if (procManager) {
                    notificationsToAdd.push(createNotification(procManager.id, indent.id, `Indent ${indent.id} ready for procurement`));
                }
            }

            return {
                ...state,
                indents: state.indents.map(ind =>
                    ind.id === action.payload.indentId
                        ? {
                            ...ind,
                            status: 'approved',
                            activityLog: addActivityLog(ind, 'Approved', approvedBy, action.payload.note || '')
                        }
                        : ind
                ),
                notifications: [...state.notifications, ...notificationsToAdd]
            };
        }

        case 'REJECT_INDENT': {
            const indent = state.indents.find(i => i.id === action.payload.indentId);
            let notificationsToAdd = [];
            const rejectedBy = action.payload.rejectedBy || state.currentUserId;

            const isReturnForRevision = action.payload.returnForRevision;
            const newStatus = isReturnForRevision ? 'returned_for_revision' : 'rejected';
            const actionLabel = isReturnForRevision ? 'Returned for Revision' : 'Rejected';

            if (indent) {
                notificationsToAdd.push(createNotification(indent.createdBy, indent.id,
                    isReturnForRevision
                        ? `Indent ${indent.id} returned for revision: ${action.payload.reason}`
                        : `Indent ${indent.id} rejected`
                ));
            }

            return {
                ...state,
                indents: state.indents.map(ind =>
                    ind.id === action.payload.indentId
                        ? {
                            ...ind,
                            status: newStatus,
                            rejectionReason: action.payload.reason,
                            activityLog: addActivityLog(ind, actionLabel, rejectedBy, action.payload.reason)
                        }
                        : ind
                ),
                notifications: [...state.notifications, ...notificationsToAdd]
            };
        }

        case 'ASSIGN_INDENT': {
            let notificationsToAdd = [];
            const assignedBy = action.payload.assignedBy || state.currentUserId;
            const assigneeName = state.users.find(u => u.id === action.payload.userId)?.name || action.payload.userId;

            notificationsToAdd.push(createNotification(action.payload.userId, action.payload.indentId, `Indent assigned to you`));

            return {
                ...state,
                indents: state.indents.map(ind =>
                    ind.id === action.payload.indentId
                        ? {
                            ...ind,
                            status: 'in_procurement',
                            assignedTo: action.payload.userId,
                            activityLog: addActivityLog(ind, 'Assigned to Procurement', assignedBy, `Assigned to ${assigneeName}`)
                        }
                        : ind
                ),
                notifications: [...state.notifications, ...notificationsToAdd]
            };
        }

        case 'MARK_DISPATCHED': {
            const indentId = typeof action.payload === 'string' ? action.payload : action.payload.indentId;
            const dispatchedBy = (typeof action.payload === 'object' && action.payload.dispatchedBy) || state.currentUserId;
            const indent = state.indents.find(i => i.id === indentId);
            let notificationsToAdd = [];

            if (indent) {
                const userSiteAssignments = state.siteAssignments;
                const siteAssignedStorekeepers = Object.entries(userSiteAssignments)
                    .filter(([userId, siteIds]) => siteIds.includes(indent.siteId))
                    .map(([userId]) => userId)
                    .filter(userId => {
                        const user = state.users.find(u => u.id === userId);
                        return user && user.role === 'storekeeper';
                    });

                siteAssignedStorekeepers.forEach(skId => {
                    notificationsToAdd.push(createNotification(skId, indent.id, `Indent ${indent.id} dispatched to your site`));
                });
            }

            return {
                ...state,
                indents: state.indents.map(ind =>
                    ind.id === indentId
                        ? {
                            ...ind,
                            status: 'dispatched',
                            activityLog: addActivityLog(ind, 'Dispatched', dispatchedBy, '')
                        }
                        : ind
                ),
                notifications: [...state.notifications, ...notificationsToAdd]
            };
        }

        case 'RECEIVE_ITEMS': {
            let notificationsToAdd = [];
            const receivedBy = action.payload.receivedBy || state.currentUserId;

            return {
                ...state,
                indents: state.indents.map(ind => {
                    if (ind.id === action.payload.indentId) {
                        const updatedLineItems = ind.lineItems.map(li =>
                            action.payload.lineItemUpdates[li.id]
                                ? { ...li, received: action.payload.lineItemUpdates[li.id] }
                                : li
                        );
                        const allFullyReceived = updatedLineItems.every(li => li.received >= li.qty);

                        if (allFullyReceived) {
                            notificationsToAdd.push(createNotification(ind.createdBy, ind.id, `Indent ${ind.id} completed - all items received`));

                            const userSiteAssignments = state.siteAssignments;
                            const pmId = Object.entries(userSiteAssignments)
                                .find(([userId, siteIds]) => siteIds.includes(ind.siteId) && state.users.find(u => u.id === userId && u.role === 'project_manager'))?.[0];
                            if (pmId) {
                                notificationsToAdd.push(createNotification(pmId, ind.id, `Indent ${ind.id} completed`));
                            }
                        }

                        const logNote = allFullyReceived ? 'All items received in full' : 'Partial items received';
                        return {
                            ...ind,
                            lineItems: updatedLineItems,
                            status: allFullyReceived ? 'completed' : ind.status,
                            activityLog: addActivityLog(ind, allFullyReceived ? 'Completed' : 'Items Received (Partial)', receivedBy, logNote)
                        };
                    }
                    return ind;
                }),
                notifications: [...state.notifications, ...notificationsToAdd]
            };
        }

        case 'ADD_COMMENT':
            return {
                ...state,
                indents: state.indents.map(ind =>
                    ind.id === action.payload.indentId
                        ? {
                            ...ind,
                            comments: [
                                ...(ind.comments || []),
                                {
                                    id: `cmt-${Date.now()}`,
                                    author: action.payload.author,
                                    text: action.payload.text,
                                    createdAt: new Date().toISOString(),
                                },
                            ],
                        }
                        : ind
                ),
            };

        case 'MARK_NOTIFICATION_READ':
            return {
                ...state,
                notifications: state.notifications.map(n =>
                    n.id === action.payload
                        ? { ...n, read: true }
                        : n
                ),
            };

        case 'REVISE_RESUBMIT': {
            const indent = state.indents.find(i => i.id === action.payload.indentId);
            let notificationsToAdd = [];

            if (indent) {
                const userSiteAssignments = state.siteAssignments;
                const siteAssignedPMs = Object.entries(userSiteAssignments)
                    .filter(([userId, siteIds]) => siteIds.includes(indent.siteId))
                    .map(([userId]) => userId)
                    .filter(userId => {
                        const user = state.users.find(u => u.id === userId);
                        return user && user.role === 'project_manager';
                    });

                const md = state.users.find(u => u.role === 'md');

                siteAssignedPMs.forEach(pmId => {
                    notificationsToAdd.push(createNotification(pmId, indent.id, `Indent ${indent.id} resubmitted for approval`));
                });

                if (md) {
                    notificationsToAdd.push(createNotification(md.id, indent.id, `Indent ${indent.id} resubmitted for approval`));
                }
            }

            return {
                ...state,
                indents: state.indents.map(ind =>
                    ind.id === action.payload.indentId
                        ? {
                            ...ind,
                            status: 'pending_approval',
                            lineItems: action.payload.lineItems,
                            notes: action.payload.notes,
                            submittedAt: new Date().toISOString(),
                            isRevised: true,
                            revisionCount: (ind.revisionCount || 0) + 1,
                            comments: [
                                ...(ind.comments || []),
                                {
                                    id: `cmt-${Date.now()}`,
                                    author: action.payload.revisedBy,
                                    text: action.payload.remarks || 'Revised and resubmitted',
                                    createdAt: new Date().toISOString(),
                                },
                            ],
                            activityLog: addActivityLog(ind, 'Revised & Resubmitted', action.payload.revisedBy, action.payload.remarks || `Revision #${(ind.revisionCount || 0) + 1}`)
                        }
                        : ind
                ),
                notifications: [...state.notifications, ...notificationsToAdd]
            };
        }

        case 'SUBMIT_DRAFT': {
            const indent = state.indents.find(i => i.id === action.payload);
            let notificationsToAdd = [];

            if (indent) {
                const userSiteAssignments = state.siteAssignments;
                const siteAssignedPMs = Object.entries(userSiteAssignments)
                    .filter(([userId, siteIds]) => siteIds.includes(indent.siteId))
                    .map(([userId]) => userId)
                    .filter(userId => {
                        const user = state.users.find(u => u.id === userId);
                        return user && user.role === 'project_manager';
                    });

                const md = state.users.find(u => u.role === 'md');

                siteAssignedPMs.forEach(pmId => {
                    notificationsToAdd.push(createNotification(pmId, indent.id, `Draft indent ${indent.id} submitted for approval`));
                });

                if (md) {
                    notificationsToAdd.push(createNotification(md.id, indent.id, `Draft indent ${indent.id} submitted for approval`));
                }
            }

            return {
                ...state,
                indents: state.indents.map(ind =>
                    ind.id === action.payload
                        ? {
                            ...ind,
                            status: 'pending_approval',
                            submittedAt: new Date().toISOString(),
                            activityLog: addActivityLog(ind, 'Submitted for Approval', ind.createdBy, '')
                        }
                        : ind
                ),
                notifications: [...state.notifications, ...notificationsToAdd]
            };
        }

        case 'UPDATE_DRAFT':
            return {
                ...state,
                indents: state.indents.map(ind =>
                    ind.id === action.payload.indentId
                        ? {
                            ...ind,
                            description: action.payload.description,
                            notes: action.payload.notes,
                            lineItems: action.payload.lineItems,
                            activityLog: addActivityLog(ind, 'Draft Updated', ind.createdBy, '')
                        }
                        : ind
                ),
            };

        case 'SHOW_TOAST':
            return { ...state, toast: action.payload };

        case 'HIDE_TOAST':
            return { ...state, toast: null };

        case 'ADD_USER':
            return {
                ...state,
                users: [...state.users, action.payload.user],
                siteAssignments: { ...state.siteAssignments, [action.payload.user.id]: [] }
            };

        case 'EDIT_USER': {
            return {
                ...state,
                users: state.users.map(u =>
                    u.id === action.payload.userId
                        ? {
                            ...u,
                            name: action.payload.name !== undefined ? action.payload.name : u.name,
                            email: action.payload.email !== undefined ? action.payload.email : u.email,
                            role: action.payload.role !== undefined ? action.payload.role : u.role,
                        }
                        : u
                ),
            };
        }

        case 'DELETE_USER': {
            const deleteUserId = action.payload;
            const updatedAssignments = { ...state.siteAssignments };
            delete updatedAssignments[deleteUserId];
            return {
                ...state,
                users: state.users.filter(u => u.id !== deleteUserId),
                siteAssignments: updatedAssignments,
                indents: state.indents.map(ind =>
                    ind.assignedTo === deleteUserId
                        ? { ...ind, assignedTo: undefined }
                        : ind
                ),
            };
        }

        case 'ADD_SITE':
            return {
                ...state,
                sites: [...state.sites, action.payload],
                boqLists: { ...state.boqLists, [action.payload.id]: [] }
            };

        case 'EDIT_SITE': {
            return {
                ...state,
                sites: state.sites.map(s =>
                    s.id === action.payload.siteId
                        ? {
                            ...s,
                            name: action.payload.name !== undefined ? action.payload.name : s.name,
                            location: action.payload.location !== undefined ? action.payload.location : s.location,
                        }
                        : s
                ),
            };
        }

        case 'DELETE_SITE': {
            const deleteSiteId = action.payload;
            const updatedSiteAssignments = {};
            Object.entries(state.siteAssignments).forEach(([userId, siteIds]) => {
                updatedSiteAssignments[userId] = siteIds.filter(id => id !== deleteSiteId);
            });
            const updatedBoqLists = { ...state.boqLists };
            delete updatedBoqLists[deleteSiteId];
            return {
                ...state,
                sites: state.sites.filter(s => s.id !== deleteSiteId),
                siteAssignments: updatedSiteAssignments,
                boqLists: updatedBoqLists,
            };
        }

        case 'TOGGLE_SITE_ASSIGNMENT': {
            const { userId, siteId } = action.payload;
            const currentAssignments = state.siteAssignments[userId] || [];
            const newAssignments = currentAssignments.includes(siteId)
                ? currentAssignments.filter(id => id !== siteId)
                : [...currentAssignments, siteId];
            return {
                ...state,
                siteAssignments: { ...state.siteAssignments, [userId]: newAssignments }
            };
        }

        case 'ADD_VENDOR':
            return { ...state, vendors: [...state.vendors, action.payload] };

        case 'EDIT_VENDOR': {
            return {
                ...state,
                vendors: state.vendors.map(v =>
                    v.id === action.payload.vendorId
                        ? { ...v, ...action.payload.updates }
                        : v
                ),
            };
        }

        case 'DELETE_VENDOR': {
            return {
                ...state,
                vendors: state.vendors.filter(v => v.id !== action.payload),
            };
        }

        case 'CLONE_INDENT': {
            const sourceIndent = state.indents.find(i => i.id === action.payload.sourceIndentId);
            if (!sourceIndent) return state;

            const clonedBy = action.payload.clonedBy || state.currentUserId;
            const newIndentId = `IND-2026-${String(state.indents.length + 1).padStart(4, '0')}`;
            const clonedIndent = {
                ...sourceIndent,
                id: newIndentId,
                createdBy: clonedBy,
                createdAt: new Date().toISOString(),
                status: 'draft',
                priority: sourceIndent.priority || 'normal',
                assignedTo: undefined,
                submittedAt: undefined,
                rejectionReason: undefined,
                returnReason: undefined,
                escalationRemarks: undefined,
                mdRemarks: undefined,
                mdEscalationResult: undefined,
                linkedPO: undefined,
                externalPO: undefined,
                isRevised: undefined,
                revisionCount: 0,
                lineItems: sourceIndent.lineItems.map((li, idx) => ({
                    ...li,
                    id: `li-clone-${Date.now()}-${idx}`,
                    received: 0,
                })),
                comments: [],
                activityLog: [
                    createActivityLogEntry('Created', clonedBy, `Cloned from ${sourceIndent.id}`)
                ],
            };

            return {
                ...state,
                indents: [...state.indents, clonedIndent],
            };
        }

        case 'BULK_APPROVE': {
            const indentIds = action.payload.indentIds || [];
            const approvedBy = action.payload.approvedBy || state.currentUserId;
            let notificationsToAdd = [];

            const updatedIndents = state.indents.map(ind => {
                if (indentIds.includes(ind.id) && ind.status === 'pending_approval') {
                    notificationsToAdd.push(createNotification(ind.createdBy, ind.id, `Indent ${ind.id} approved`));

                    const procManager = state.users.find(u => u.role === 'procurement_manager');
                    if (procManager) {
                        notificationsToAdd.push(createNotification(procManager.id, ind.id, `Indent ${ind.id} ready for procurement`));
                    }

                    return {
                        ...ind,
                        status: 'approved',
                        activityLog: addActivityLog(ind, 'Approved (Bulk)', approvedBy, `Bulk approved with ${indentIds.length} other indents`)
                    };
                }
                return ind;
            });

            return {
                ...state,
                indents: updatedIndents,
                notifications: [...state.notifications, ...notificationsToAdd]
            };
        }

        case 'LOG_ACTIVITY': {
            return {
                ...state,
                indents: state.indents.map(ind =>
                    ind.id === action.payload.indentId
                        ? {
                            ...ind,
                            activityLog: addActivityLog(
                                ind,
                                action.payload.action,
                                action.payload.by || state.currentUserId,
                                action.payload.note || ''
                            )
                        }
                        : ind
                ),
            };
        }

        case 'CREATE_PO': {
            const po = {
                ...action.payload.po,
                lineItems: (action.payload.po.lineItems || []).map(li => ({
                    ...li,
                    gstPercent: li.gstPercent !== undefined ? li.gstPercent : 18
                }))
            };
            return {
                ...state,
                purchaseOrders: [...state.purchaseOrders, po],
                indents: state.indents.map(ind =>
                    ind.id === action.payload.indentId
                        ? {
                            ...ind,
                            status: 'po_draft',
                            linkedPO: po.id,
                            activityLog: addActivityLog(ind, 'PO Created', state.currentUserId, `PO ${po.id} created`)
                        }
                        : ind
                ),
            };
        }

        case 'ATTACH_EXTERNAL_PO':
            return {
                ...state,
                indents: state.indents.map(ind =>
                    ind.id === action.payload.indentId
                        ? {
                            ...ind,
                            status: 'po_issued',
                            externalPO: action.payload.fileName,
                            linkedPO: 'external',
                            activityLog: addActivityLog(ind, 'External PO Attached', state.currentUserId, `File: ${action.payload.fileName}`)
                        }
                        : ind
                ),
            };

        case 'ESCALATE_TO_MD':
            return {
                ...state,
                indents: state.indents.map(ind =>
                    ind.id === action.payload.indentId
                        ? {
                            ...ind,
                            status: 'escalated_to_md',
                            escalationRemarks: action.payload.remarks,
                            activityLog: addActivityLog(ind, 'Escalated to MD', state.currentUserId, action.payload.remarks)
                        }
                        : ind
                ),
                notifications: [
                    ...state.notifications,
                    createNotification(
                        state.users.find(u => u.role === 'md')?.id || 'md-001',
                        action.payload.indentId,
                        `Escalated: Indent ${action.payload.indentId} needs your decision` + (action.payload.remarks ? ' -- ' + action.payload.remarks.substring(0, 50) : '')
                    )
                ]
            };

        case 'MD_ESCALATION_APPROVE':
            return {
                ...state,
                indents: state.indents.map(ind =>
                    ind.id === action.payload.indentId
                        ? {
                            ...ind,
                            status: 'in_procurement',
                            mdEscalationResult: 'approved',
                            mdRemarks: action.payload.remarks,
                            activityLog: addActivityLog(ind, 'MD Escalation Approved', state.currentUserId, action.payload.remarks || '')
                        }
                        : ind
                ),
                notifications: [
                    ...state.notifications,
                    createNotification(
                        state.users.find(u => u.role === 'procurement_manager')?.id || 'proc-001',
                        action.payload.indentId,
                        `MD approved escalation for ${action.payload.indentId} -- proceed with PO`
                    )
                ]
            };

        case 'MD_ESCALATION_DISMISS': {
            const targetIndent = state.indents.find(i => i.id === action.payload.indentId);
            return {
                ...state,
                indents: state.indents.map(ind =>
                    ind.id === action.payload.indentId
                        ? {
                            ...ind,
                            status: 'returned_for_revision',
                            mdEscalationResult: 'dismissed',
                            mdRemarks: action.payload.remarks,
                            activityLog: addActivityLog(ind, 'MD Escalation Dismissed', state.currentUserId, action.payload.remarks || '')
                        }
                        : ind
                ),
                notifications: [
                    ...state.notifications,
                    createNotification(
                        targetIndent?.createdBy || '',
                        action.payload.indentId,
                        `Indent ${action.payload.indentId} returned for revision by MD`
                    )
                ]
            };
        }

        case 'REQUEST_MD_PO_APPROVAL':
            return {
                ...state,
                purchaseOrders: state.purchaseOrders.map(po =>
                    po.id === action.payload.poId
                        ? { ...po, status: 'pending_md_approval' }
                        : po
                ),
                indents: state.indents.map(ind =>
                    ind.linkedPO === action.payload.poId
                        ? {
                            ...ind,
                            status: 'pending_md_po_approval',
                            activityLog: addActivityLog(ind, 'PO Sent for MD Approval', state.currentUserId, `PO ${action.payload.poId}`)
                        }
                        : ind
                ),
                notifications: [
                    ...state.notifications,
                    createNotification(
                        state.users.find(u => u.role === 'md')?.id || 'md-001',
                        action.payload.indentId,
                        `PO ${action.payload.poId} needs your approval`
                    )
                ]
            };

        case 'MD_APPROVE_PO':
            return {
                ...state,
                purchaseOrders: state.purchaseOrders.map(po =>
                    po.id === action.payload.poId
                        ? { ...po, status: 'approved' }
                        : po
                ),
                indents: state.indents.map(ind =>
                    ind.linkedPO === action.payload.poId
                        ? {
                            ...ind,
                            status: 'po_approved',
                            activityLog: addActivityLog(ind, 'PO Approved by MD', state.currentUserId, `PO ${action.payload.poId}`)
                        }
                        : ind
                ),
            };

        case 'MD_REJECT_PO':
            return {
                ...state,
                purchaseOrders: state.purchaseOrders.map(po =>
                    po.id === action.payload.poId
                        ? { ...po, status: 'rejected', mdRejectReason: action.payload.reason }
                        : po
                ),
                indents: state.indents.map(ind =>
                    ind.linkedPO === action.payload.poId
                        ? {
                            ...ind,
                            status: 'po_draft',
                            activityLog: addActivityLog(ind, 'PO Rejected by MD', state.currentUserId, action.payload.reason || '')
                        }
                        : ind
                ),
            };

        case 'FINALIZE_PO':
            return {
                ...state,
                purchaseOrders: state.purchaseOrders.map(po =>
                    po.id === action.payload.poId
                        ? { ...po, status: 'issued' }
                        : po
                ),
                indents: state.indents.map(ind =>
                    ind.linkedPO === action.payload.poId
                        ? {
                            ...ind,
                            status: 'po_issued',
                            activityLog: addActivityLog(ind, 'PO Finalized & Issued', state.currentUserId, `PO ${action.payload.poId} issued`)
                        }
                        : ind
                ),
            };

        case 'RETURN_FOR_REVISION':
            return {
                ...state,
                indents: state.indents.map(ind =>
                    ind.id === action.payload.indentId
                        ? {
                            ...ind,
                            status: 'returned_for_revision',
                            returnReason: action.payload.reason,
                            activityLog: addActivityLog(ind, 'Returned for Revision', state.currentUserId, action.payload.reason || '')
                        }
                        : ind
                ),
            };

        case 'ASSIGN_SITE': {
            const { userId, siteId } = action.payload;
            const current = state.siteAssignments[userId] || [];
            if (current.includes(siteId)) return state;
            return {
                ...state,
                siteAssignments: {
                    ...state.siteAssignments,
                    [userId]: [...current, siteId],
                },
            };
        }

        case 'UNASSIGN_SITE': {
            const { userId, siteId } = action.payload;
            const current = state.siteAssignments[userId] || [];
            return {
                ...state,
                siteAssignments: {
                    ...state.siteAssignments,
                    [userId]: current.filter(s => s !== siteId),
                },
            };
        }

        case 'UPDATE_ORG_SETTINGS':
            return { ...state, orgSettings: { ...state.orgSettings, ...action.payload } };

        case 'ADD_DOCUMENT': {
            return {
                ...state,
                indents: state.indents.map(ind =>
                    ind.id === action.payload.indentId
                        ? {
                            ...ind,
                            documents: [...(ind.documents || []), action.payload.document],
                            activityLog: addActivityLog(ind, 'Document Uploaded', state.currentUserId, action.payload.document.name + ' (' + action.payload.document.category + ')')
                        }
                        : ind
                ),
            };
        }

        case 'DELETE_DOCUMENT': {
            return {
                ...state,
                indents: state.indents.map(ind =>
                    ind.id === action.payload.indentId
                        ? {
                            ...ind,
                            documents: (ind.documents || []).filter(d => d.id !== action.payload.documentId),
                            activityLog: addActivityLog(ind, 'Document Removed', state.currentUserId, action.payload.documentName || '')
                        }
                        : ind
                ),
            };
        }

        case 'UPDATE_PO': {
            const existingPO = state.purchaseOrders.find(p => p.id === action.payload.poId);
            if (!existingPO) return state;
            const newVersion = (existingPO.version || 1) + 1;
            const updatedPO = {
                ...existingPO,
                ...action.payload.updates,
                version: newVersion,
                updatedAt: new Date().toISOString(),
                updatedBy: state.currentUserId,
            };
            // Keep old version in history
            const versionEntry = {
                version: existingPO.version || 1,
                data: { ...existingPO },
                savedAt: new Date().toISOString(),
                savedBy: state.currentUserId,
            };
            updatedPO.versionHistory = [...(existingPO.versionHistory || []), versionEntry];
            return {
                ...state,
                purchaseOrders: state.purchaseOrders.map(po =>
                    po.id === action.payload.poId ? updatedPO : po
                ),
                indents: state.indents.map(ind =>
                    ind.id === existingPO.indentId
                        ? { ...ind, activityLog: addActivityLog(ind, 'PO Updated to v' + newVersion, state.currentUserId, action.payload.note || '') }
                        : ind
                ),
            };
        }

        // ── Office Management ──
        case 'ADD_OFFICE':
            return { ...state, offices: [...(state.offices || []), action.payload] };

        case 'UPDATE_OFFICE':
            return {
                ...state,
                offices: (state.offices || []).map(function(o) {
                    return o.id === action.payload.officeId ? Object.assign({}, o, action.payload.updates) : o;
                }),
            };

        case 'DELETE_OFFICE': {
            var linkedSites = (state.sites || []).filter(function(s) { return s.officeId === action.payload; });
            if (linkedSites.length > 0) return state; // Cannot delete if sites linked
            return { ...state, offices: (state.offices || []).filter(function(o) { return o.id !== action.payload; }) };
        }

        // ── PO Lifecycle ──
        case 'SUBMIT_PO_FOR_APPROVAL': {
            var _spfa_po = (state.purchaseOrders || []).find(function(p) { return p.id === action.payload.poId; });
            if (!_spfa_po || _spfa_po.status !== 'draft') return state;
            return {
                ...state,
                purchaseOrders: state.purchaseOrders.map(function(po) {
                    return po.id === action.payload.poId ? Object.assign({}, po, { status: 'pending_approval', submittedAt: new Date().toISOString(), submittedBy: state.currentUserId }) : po;
                }),
                indents: state.indents.map(function(ind) {
                    return ind.linkedPO === action.payload.poId
                        ? Object.assign({}, ind, { activityLog: addActivityLog(ind, 'PO Submitted for Approval', state.currentUserId, 'PO ' + action.payload.poId) })
                        : ind;
                }),
            };
        }

        case 'APPROVE_PO': {
            var _apo = (state.purchaseOrders || []).find(function(p) { return p.id === action.payload.poId; });
            if (!_apo || _apo.status !== 'pending_approval') return state;
            return {
                ...state,
                purchaseOrders: state.purchaseOrders.map(function(po) {
                    return po.id === action.payload.poId ? Object.assign({}, po, { status: 'approved', approvedAt: new Date().toISOString(), approvedBy: state.currentUserId }) : po;
                }),
                indents: state.indents.map(function(ind) {
                    return ind.linkedPO === action.payload.poId
                        ? Object.assign({}, ind, { status: 'po_approved', activityLog: addActivityLog(ind, 'PO Approved', state.currentUserId, 'PO ' + action.payload.poId + ' approved') })
                        : ind;
                }),
            };
        }

        case 'REJECT_PO': {
            var _rpo = (state.purchaseOrders || []).find(function(p) { return p.id === action.payload.poId; });
            if (!_rpo) return state;
            return {
                ...state,
                purchaseOrders: state.purchaseOrders.map(function(po) {
                    return po.id === action.payload.poId ? Object.assign({}, po, { status: 'draft', rejectedAt: new Date().toISOString(), rejectedBy: state.currentUserId, rejectReason: action.payload.reason || '' }) : po;
                }),
                indents: state.indents.map(function(ind) {
                    return ind.linkedPO === action.payload.poId
                        ? Object.assign({}, ind, { status: 'po_draft', activityLog: addActivityLog(ind, 'PO Rejected', state.currentUserId, action.payload.reason || '') })
                        : ind;
                }),
            };
        }

        case 'ISSUE_PO': {
            var _ipo = (state.purchaseOrders || []).find(function(p) { return p.id === action.payload.poId; });
            if (!_ipo || _ipo.status !== 'approved') return state;
            return {
                ...state,
                purchaseOrders: state.purchaseOrders.map(function(po) {
                    return po.id === action.payload.poId ? Object.assign({}, po, { status: 'issued', issuedAt: new Date().toISOString(), issuedBy: state.currentUserId }) : po;
                }),
                indents: state.indents.map(function(ind) {
                    return ind.linkedPO === action.payload.poId
                        ? Object.assign({}, ind, { status: 'po_issued', activityLog: addActivityLog(ind, 'PO Issued to Vendor', state.currentUserId, 'PO ' + action.payload.poId + ' issued') })
                        : ind;
                }),
            };
        }

        case 'RECEIVE_AGAINST_PO': {
            var _rap_poId = action.payload.poId;
            var _rap_receipts = action.payload.receipts || [];
            var _rap_po = (state.purchaseOrders || []).find(function(p) { return p.id === _rap_poId; });
            if (!_rap_po) return state;

            var grnId = 'GRN-' + Date.now();
            var newGrns = _rap_receipts.map(function(r, ri) {
                return {
                    id: grnId + '-' + ri,
                    poId: _rap_poId,
                    lineItemId: r.lineItemId,
                    quantityReceived: parseFloat(r.quantityReceived) || 0,
                    receivedBy: state.currentUserId,
                    receivedAt: new Date().toISOString(),
                    remarks: r.remarks || '',
                };
            });

            var updatedPoLineItems = _rap_po.lineItems.map(function(li) {
                var receipt = _rap_receipts.find(function(r) { return r.lineItemId === li.id; });
                if (receipt) {
                    return Object.assign({}, li, { receivedQty: (li.receivedQty || 0) + (parseFloat(receipt.quantityReceived) || 0) });
                }
                return li;
            });

            var allFulfilled = updatedPoLineItems.every(function(li) { return (li.receivedQty || 0) >= (li.quantity || li.qty || 0); });
            var someFulfilled = updatedPoLineItems.some(function(li) { return (li.receivedQty || 0) > 0; });
            var newPoStatus = allFulfilled ? 'fulfilled' : (someFulfilled ? 'partially_fulfilled' : _rap_po.status);

            return {
                ...state,
                grns: [...(state.grns || []), ...newGrns],
                purchaseOrders: state.purchaseOrders.map(function(po) {
                    return po.id === _rap_poId ? Object.assign({}, po, { lineItems: updatedPoLineItems, status: newPoStatus }) : po;
                }),
                indents: state.indents.map(function(ind) {
                    return ind.linkedPO === _rap_poId
                        ? Object.assign({}, ind, { activityLog: addActivityLog(ind, allFulfilled ? 'PO Fully Received' : 'PO Partial Receipt', state.currentUserId, 'GRN recorded for PO ' + _rap_poId) })
                        : ind;
                }),
            };
        }

        case 'CLOSE_PO': {
            return {
                ...state,
                purchaseOrders: state.purchaseOrders.map(function(po) {
                    return po.id === action.payload.poId ? Object.assign({}, po, { status: 'closed', closedAt: new Date().toISOString(), closedBy: state.currentUserId }) : po;
                }),
            };
        }

        case 'CANCEL_PO': {
            return {
                ...state,
                purchaseOrders: state.purchaseOrders.map(function(po) {
                    return po.id === action.payload.poId ? Object.assign({}, po, { status: 'cancelled', cancelledAt: new Date().toISOString(), cancelledBy: state.currentUserId, cancelReason: action.payload.reason || '' }) : po;
                }),
            };
        }

        case 'AMEND_PO': {
            var _amp = (state.purchaseOrders || []).find(function(p) { return p.id === action.payload.poId; });
            if (!_amp) return state;
            return {
                ...state,
                purchaseOrders: state.purchaseOrders.map(function(po) {
                    return po.id === action.payload.poId ? Object.assign({}, po, { status: 'amendment_pending', amendedAt: new Date().toISOString(), amendedBy: state.currentUserId }) : po;
                }),
                indents: state.indents.map(function(ind) {
                    return ind.linkedPO === action.payload.poId
                        ? Object.assign({}, ind, { activityLog: addActivityLog(ind, 'PO Amendment Requested', state.currentUserId, 'PO ' + action.payload.poId + ' needs re-approval') })
                        : ind;
                }),
            };
        }

        default:
            return state;
    }
}

function getUserSites(userId, sites, siteAssignments) {
    const assignedIds = siteAssignments[userId] || [];
    return sites.filter(s => assignedIds.includes(s.id));
}

function getUserName(userId, users) {
    const user = users.find(u => u.id === userId);
    return user ? user.name : 'Unknown';
}

function getRoleBadge(role) {
    const labels = {
        admin: 'Admin',
        site_engineer: 'Engineer',
        storekeeper: 'Storekeeper',
        project_manager: 'PM',
        md: 'MD',
        procurement_manager: 'Proc. Manager',
        procurement_clerk: 'Clerk'
    };
    return labels[role] || role;
}

function getSiteName(siteId, sites) {
    const site = sites.find(s => s.id === siteId);
    return site ? `${site.name} (${site.location})` : 'Unknown';
}

function Toast({ message, type }) {
  if (!message) return null;
  const colors = {
    success: { bg: '#dcfce7', border: '#16a34a', text: '#15803d' },
    error: { bg: '#fee2e2', border: '#dc2626', text: '#991b1b' },
    info: { bg: '#dbeafe', border: '#2563eb', text: '#1e40af' },
    warning: { bg: '#fef9c3', border: '#ca8a04', text: '#854d0e' },
  };
  const c = colors[type] || colors.info;
  return React.createElement('div', {
    style: {
      position: 'fixed', top: 20, right: 20, zIndex: 9999,
      padding: '12px 24px', borderRadius: 8,
      backgroundColor: c.bg, border: '1px solid ' + c.border, color: c.text,
      fontWeight: 600, fontSize: 14, boxShadow: '0 4px 12px rgba(0,0,0,0.15)',
      animation: 'slideIn 0.3s ease-out',
    }
  }, message);
}

// 2. useHashRoute Hook
// ─────────────────────────────────────────────
function useHashRoute() {
  const [hash, setHash] = useState(window.location.hash || '#login');
  useEffect(() => {
    const handler = () => setHash(window.location.hash || '#login');
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);
  return hash;
}

    escalated_to_md: { bg: '#fce7f3', color: '#be185d' },
    returned_for_revision: { bg: '#ffedd5', color: '#c2410c' },
    po_draft: { bg: '#e0e7ff', color: '#4338ca' },
    pending_md_po_approval: { bg: '#ede9fe', color: '#6d28d9' },
    po_approved: { bg: '#d1fae5', color: '#047857' },
    po_issued: { bg: '#cffafe', color: '#0e7490' },
    dispatched: { bg: '#f3e8ff', color: '#7c3aed' },
    completed: { bg: '#d1fae5', color: '#047857' },
    partial: { bg: '#fef9c3', color: '#a16207' },
    issued: { bg: '#cffafe', color: '#0e7490' },
    partially_fulfilled: { bg: '#fef9c3', color: '#a16207' },
    fulfilled: { bg: '#d1fae5', color: '#047857' },
    closed: { bg: '#e2e8f0', color: '#475569' },

function UsersScreen() {
  const [state, dispatch] = useContext(AppContext);
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [role, setRole] = useState('engineer');
  const [deleteConfirm, setDeleteConfirm] = useState(null);

  const resetForm = () => {
    setName(''); setEmail(''); setPassword(''); setRole('engineer');
    setShowForm(false); setEditingId(null);
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (editingId) {
      dispatch({
        type: 'EDIT_USER',
        payload: { id: editingId, name, email, role }
      });
    } else {
      dispatch({
        type: 'ADD_USER',
        payload: { id: Date.now(), name, email, password: password || 'password', role }
      });
    }
    resetForm();
  };

  const startEdit = (user) => {
    setEditingId(user.id);
    setName(user.name);
    setEmail(user.email);
    setRole(user.role);
    setShowForm(true);
  };

  const handleDelete = (userId) => {
    dispatch({ type: 'DELETE_USER', payload: { id: userId } });
    setDeleteConfirm(null);
  };

  const btnStyle = {
    padding: '6px 14px', borderRadius: 6, border: 'none',
    fontWeight: 600, fontSize: 12, cursor: 'pointer',
  };

  return React.createElement('div', { style: { padding: 24 } },
    React.createElement('div', {
      style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24 }

        style: { fontSize: 22, fontWeight: 800, color: '#1e293b' }

      React.createElement('button', {
        onClick: () => { resetForm(); setShowForm(!showForm); },
        style: {
          ...btnStyle,
          padding: '10px 20px', background: '#6366f1', color: '#fff', fontSize: 14,

      }, showForm ? 'Cancel' : '+ Add User')

    setEditingId(site.id);

      setDeleteError('');

function ApprovalsScreen() {
  const [state, dispatch] = useContext(AppContext);
  const user = state.currentUser;
  const [selected, setSelected] = useState([]);

  const priorityOrder = { urgent: 0, normal: 1, low: 2 };

  const pendingIndents = state.indents
    .filter(i => i.status === 'pending_approval')
    .sort((a, b) => {
      // Sort by priority first (urgent first)
      const pDiff = (priorityOrder[a.priority] || 1) - (priorityOrder[b.priority] || 1);
      if (pDiff !== 0) return pDiff;
      // Then by hours pending (longest first = earliest created first)
      return new Date(a.createdAt) - new Date(b.createdAt);
    });

  const toggleSelect = (id) => {
    setSelected(prev =>
      prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
    );
  };

  const toggleAll = () => {
    if (selected.length === pendingIndents.length) {
      setSelected([]);
    } else {
      setSelected(pendingIndents.map(i => i.id));
    }
  };

  const handleBulkApprove = () => {
    if (selected.length === 0) return;
    dispatch({
      type: 'BULK_APPROVE',
      payload: { indentIds: selected, approvedBy: user.id }
    });
    selected.forEach(indentId => {
      dispatch({
        type: 'LOG_ACTIVITY',
        payload: {
          indentId: indentId,
          entry: createActivityLogEntry('Approved (bulk)', user.id)
        }
      });
    });
    setSelected([]);
  };

  const getHoursPending = (createdAt) => {
    const hours = Math.round((Date.now() - new Date(createdAt).getTime()) / (1000 * 60 * 60));
    if (hours < 1) return 'Less than 1 hour';
    if (hours < 24) return hours + ' hour' + (hours > 1 ? 's' : '');
    const days = Math.floor(hours / 24);
    return days + ' day' + (days > 1 ? 's' : '') + ' ' + (hours % 24) + 'h';
  };

  return React.createElement('div', { style: { padding: 24 } },
    React.createElement('div', {
      style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24 }
    },
      React.createElement('h2', { style: { fontSize: 22, fontWeight: 800, color: '#1e293b' } },
        'Pending Approvals (' + pendingIndents.length + ')'
      ),
      selected.length > 0 && React.createElement('button', {
        onClick: handleBulkApprove,
        style: {
          padding: '10px 20px', borderRadius: 8, border: 'none',
          background: '#16a34a', color: '#fff', fontWeight: 700, fontSize: 14, cursor: 'pointer',
        }
      }, 'Approve Selected (' + selected.length + ')')
    ),

    pendingIndents.length === 0
      ? React.createElement('div', {
          style: {
            background: '#fff', border: '1px solid #e2e8f0', borderRadius: 12,
            padding: 40, textAlign: 'center', color: '#94a3b8',
          }
        }, React.createElement('p', { style: { fontSize: 16 } }, 'No pending indents'))
      : React.createElement('div', {
          style: { background: '#fff', border: '1px solid #e2e8f0', borderRadius: 12, overflow: 'hidden' }
        },
          React.createElement('table', { style: { width: '100%', borderCollapse: 'collapse', fontSize: 13 } },
            React.createElement('thead', null,
              React.createElement('tr', { style: { background: '#f8fafc' } },
                React.createElement('th', { style: { padding: '12px 16px', textAlign: 'center', borderBottom: '2px solid #e2e8f0', width: 40 } },
                  React.createElement('input', {
                    type: 'checkbox',
                    checked: selected.length === pendingIndents.length && pendingIndents.length > 0,
                    onChange: toggleAll,
                  })
                ),
                React.createElement('th', { style: { padding: '12px 16px', textAlign: 'left', borderBottom: '2px solid #e2e8f0', color: '#64748b', fontWeight: 700 } }, 'Indent ID'),
                React.createElement('th', { style: { padding: '12px 16px', textAlign: 'left', borderBottom: '2px solid #e2e8f0', color: '#64748b', fontWeight: 700 } }, 'Site'),
                React.createElement('th', { style: { padding: '12px 16px', textAlign: 'left', borderBottom: '2px solid #e2e8f0', color: '#64748b', fontWeight: 700 } }, 'Priority'),
                React.createElement('th', { style: { padding: '12px 16px', textAlign: 'left', borderBottom: '2px solid #e2e8f0', color: '#64748b', fontWeight: 700 } }, 'By'),
                React.createElement('th', { style: { padding: '12px 16px', textAlign: 'left', borderBottom: '2px solid #e2e8f0', color: '#64748b', fontWeight: 700 } }, 'Pending Since'),
                React.createElement('th', { style: { padding: '12px 16px', textAlign: 'left', borderBottom: '2px solid #e2e8f0', color: '#64748b', fontWeight: 700 } }, 'Items'),
                React.createElement('th', { style: { padding: '12px 16px', textAlign: 'center', borderBottom: '2px solid #e2e8f0', color: '#64748b', fontWeight: 700 } }, 'Action')
              )
            ),
            React.createElement('tbody', null,
              pendingIndents.map(indent =>
                React.createElement('tr', {
                  key: indent.id,

  if (!indent) {
    return React.createElement('div', { style: { padding: 32 } },

// ─────────────────────────────────────────────
// 23. applyIndentFilters - MODIFIED with text search + priority
// ─────────────────────────────────────────────
function applyIndentFilters(indents, filters, state) {
  let result = [...indents];

  // Text search: matches indent id or line item descriptions (case-insensitive)
  if (filters.search) {
    const term = filters.search.toLowerCase();
    result = result.filter(indent => {
      if (indent.id.toLowerCase().includes(term)) return true;
      if (indent.lineItems && indent.lineItems.some(item =>
        (item.description || '').toLowerCase().includes(term)
      )) return true;
      return false;
    });
  }

  if (filters.status) {
    result = result.filter(i => i.status === filters.status);
  }

  if (filters.priority) {
    result = result.filter(i => i.priority === filters.priority);
  }

  if (filters.site) {
    result = result.filter(i => i.siteId === filters.site);
  }

  if (filters.dateFrom) {
    const from = new Date(filters.dateFrom);
    result = result.filter(i => new Date(i.createdAt) >= from);
  }

  if (filters.dateTo) {
    const to = new Date(filters.dateTo);
    to.setHours(23, 59, 59, 999);
    result = result.filter(i => new Date(i.createdAt) <= to);
  }

  return result;
}

function CreatePOScreen({ indentId }) {
    const [state, dispatch] = React.useContext(AppContext);
    const indent = state.indents.find(i => i.id === indentId);
    const [vendorId, setVendorId] = useState('');
    const [showNewVendor, setShowNewVendor] = useState(false);
    const [newVendor, setNewVendor] = useState({
        name: '', contactPerson: '', phone: '', email: '', gstin: '', pan: '',
        address: '', city: '', state: '', pincode: '',
        bankAccount: '', bankName: '', ifsc: '',
        defaultPaymentTerms: 30, category: '', notes: ''
    });
    const [deliveryDate, setDeliveryDate] = useState('');
    const [paymentTerms, setPaymentTerms] = useState('');
    const [remarks, setRemarks] = useState('');
    const [itemRates, setItemRates] = useState({});
    const [itemGst, setItemGst] = useState({});

    if (!indent) return React.createElement('div', { className: 'placeholder-screen' }, 'Indent not found');

    const site = state.sites.find(s => s.id === indent.siteId);
    const poNumber = 'PO-2026-' + String(state.purchaseOrders.length + 1).padStart(4, '0');

    const GST_OPTIONS = [0, 5, 12, 18, 28];
    const PAYMENT_TERMS_OPTIONS = ['Advance', '7 days', '15 days', '21 days', '30 days', '45 days', '60 days', '90 days'];

    const handleRateChange = (liId, rate) => {
        setItemRates({ ...itemRates, [liId]: parseFloat(rate) || 0 });
    };

    const handleGstChange = (liId, gst) => {
        setItemGst({ ...itemGst, [liId]: parseInt(gst) });
    };

    const getGstPercent = (liId) => {
        return itemGst[liId] !== undefined ? itemGst[liId] : 18;
    };

    const getRateHistory = (description) => {
        for (let i = state.purchaseOrders.length - 1; i >= 0; i--) {
            const po = state.purchaseOrders[i];
            const matchingItem = (po.lineItems || []).find(item => item.description === description);
            if (matchingItem && matchingItem.rate > 0) {
                return matchingItem.rate;
            }
        }
        return null;
    };

    const getLineCalcs = (li) => {
        const rate = itemRates[li.id] || 0;
        const baseAmount = li.qty * rate;
        const gstPct = getGstPercent(li.id);
        const gstAmount = baseAmount * gstPct / 100;
        const totalWithGst = baseAmount + gstAmount;
        return { baseAmount, gstPct, gstAmount, totalWithGst };
    };

    const subtotal = indent.lineItems.reduce((sum, li) => sum + getLineCalcs(li).baseAmount, 0);
    const totalGst = indent.lineItems.reduce((sum, li) => sum + getLineCalcs(li).gstAmount, 0);
    const grandTotal = subtotal + totalGst;

    const handleVendorChange = (vid) => {
        if (vid === '__new__') {
            setShowNewVendor(true);
            setVendorId('');
        } else {
            setVendorId(vid);
            setShowNewVendor(false);
            const vendor = state.vendors.find(v => v.id === vid);
            if (vendor && vendor.defaultPaymentTerms) {
                setPaymentTerms(vendor.defaultPaymentTerms + ' days');
            }
        }
    };

    const handleAddNewVendor = () => {
        if (!newVendor.name.trim()) {
            dispatch({ type: 'SHOW_TOAST', payload: { message: 'Vendor name is required', type: 'error' } });
            return;
        }
        const vendorObj = {
            id: 'vendor-' + Date.now(),
            ...newVendor,
            defaultPaymentTerms: parseInt(newVendor.defaultPaymentTerms) || 30
        };
        dispatch({ type: 'ADD_VENDOR', payload: vendorObj });
        setVendorId(vendorObj.id);
        setShowNewVendor(false);
        if (vendorObj.defaultPaymentTerms) {
            setPaymentTerms(vendorObj.defaultPaymentTerms + ' days');
        }
        setNewVendor({
            name: '', contactPerson: '', phone: '', email: '', gstin: '', pan: '',
            address: '', city: '', state: '', pincode: '',
            bankAccount: '', bankName: '', ifsc: '',
            defaultPaymentTerms: 30, category: '', notes: ''
        });
        dispatch({ type: 'SHOW_TOAST', payload: { message: 'Vendor added', type: 'success' } });
    };

    const buildPO = () => {
        const vendor = state.vendors.find(v => v.id === vendorId);
        return {
            id: poNumber,
            indentId: indent.id,
            vendorId: vendorId,
            vendorName: vendor ? vendor.name : 'Unknown',
            createdBy: state.currentUserId,
            createdAt: new Date().toISOString(),
            deliveryDate,
            paymentTerms,
            deliveryAddress: site ? site.name + ', ' + site.location : '',
            remarks,
            status: 'draft',
            totalAmount: grandTotal,
            lineItems: indent.lineItems.map(li => {
                const calcs = getLineCalcs(li);
                return {
                    id: li.id,
                    description: li.description,
                    qty: li.qty,
                    unit: li.unit,
                    rate: itemRates[li.id] || 0,
                    amount: calcs.baseAmount,
                    gstPercent: calcs.gstPct,
                    gstAmount: calcs.gstAmount,
                    amountWithGst: calcs.totalWithGst,
                };
            }),
        };
    };

    const handleSaveDraft = () => {
        if (!vendorId) { dispatch({ type: 'SHOW_TOAST', payload: { message: 'Please select a vendor', type: 'error' } }); return; }
        const po = buildPO();
        dispatch({ type: 'CREATE_PO', payload: { po, indentId: indent.id } });
        dispatch({ type: 'SHOW_TOAST', payload: { message: 'PO draft saved', type: 'success' } });
        window.location.hash = '#procurement-pos';
    };

    const handleRequestApproval = () => {
        if (!vendorId) { dispatch({ type: 'SHOW_TOAST', payload: { message: 'Please select a vendor', type: 'error' } }); return; }
        const po = buildPO();
        dispatch({ type: 'CREATE_PO', payload: { po, indentId: indent.id } });
        dispatch({ type: 'REQUEST_MD_PO_APPROVAL', payload: { poId: po.id, indentId: indent.id } });
        dispatch({ type: 'SHOW_TOAST', payload: { message: 'PO sent for MD approval', type: 'success' } });

    const vendorField = (label, field, required) => {
        return React.createElement('div', null,
            React.createElement('label', { className: 'form-label' }, label + (required ? ' *' : '')),
            React.createElement('input', {
                type: 'text', className: 'form-input',
                value: newVendor[field],
                onChange: (e) => setNewVendor({ ...newVendor, [field]: e.target.value })
            })
        );

        React.createElement('div', { className: 'card' },
            React.createElement('div', { className: 'card-header' },
                React.createElement('div', { className: 'card-title' }, 'Create Purchase Order for ' + indentId)
            ),

            // PO info
            React.createElement('div', { className: 'info-grid', style: { marginBottom: '24px' } },
                React.createElement('div', { className: 'info-field' },
                    React.createElement('div', { className: 'info-label' }, 'PO Number'),
                    React.createElement('div', { className: 'info-value', style: { fontWeight: '700', color: '#2563eb' } }, poNumber)
                ),
                React.createElement('div', { className: 'info-field' },
                    React.createElement('div', { className: 'info-label' }, 'Indent'),
                    React.createElement('div', { className: 'info-value' }, indent.id)
                )
            ),

            // Vendor + Delivery Date + Payment Terms
            React.createElement('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '16px', marginBottom: '24px' } },
                React.createElement('div', { className: 'form-group' },
                    React.createElement('label', { className: 'form-label' }, 'Vendor'),
                    React.createElement('select', {
                        className: 'form-select', value: vendorId,
                        onChange: (e) => handleVendorChange(e.target.value)

                        React.createElement('option', { value: '' }, 'Select Vendor'),
                        state.vendors.map(v =>
                            React.createElement('option', { key: v.id, value: v.id }, v.name + ' (' + v.category + ')')

function StoreNewIndentScreen() {
    const [state, dispatch] = React.useContext(AppContext);
    const currentUserId = state.currentUserId;
    const userSites = getUserSites(currentUserId, state.sites, state.siteAssignments);
    const selectedSite = userSites[0]?.id || '';
    const [description, setDescription] = useState('');
    const [notes, setNotes] = useState('');
    const [requiredDate, setRequiredDate] = useState('');
    const [priority, setPriority] = useState('normal');
    const [lineItems, setLineItems] = useState([{
        id: 'li-new-1', description: '', qty: '', unit: 'bags', priority: 'medium',
        isBoq: true, boqItemId: '', nonBoqReason: '', clientApproval: false, trackCostImpact: false
    }]);

    const boqItems = state.boqLists[selectedSite] || [];

    const handleAddLineItem = () => {
        const newId = 'li-new-' + Date.now();
        setLineItems([...lineItems, {
            id: newId, description: '', qty: '', unit: 'bags', priority: 'medium',
            isBoq: true, boqItemId: '', nonBoqReason: '', clientApproval: false, trackCostImpact: false
        }]);
    };

    const handleRemoveLineItem = (id) => {
        if (lineItems.length > 1) {
            setLineItems(lineItems.filter(li => li.id !== id));
        }
    };

    const handleLineItemChange = (id, field, value) => {
        setLineItems(lineItems.map(li => {
            if (li.id !== id) return li;
            const updated = { ...li, [field]: value };
            if (field === 'boqItemId' && value) {
                const boqItem = boqItems.find(b => b.id === value);
                if (boqItem) { updated.description = boqItem.name; updated.unit = boqItem.unit; }
            }
            if (field === 'isBoq') {
                updated.boqItemId = '';
                if (value) { updated.nonBoqReason = ''; updated.clientApproval = false; updated.trackCostImpact = false; }
            }
            return updated;
        }));
    };

    const createIndentObject = (status) => {
        return {
            id: 'IND-2026-' + String(state.indents.length + 1).padStart(4, '0'),
            siteId: selectedSite,
            createdBy: currentUserId,
            createdAt: new Date().toISOString(),
            requiredDate: requiredDate || undefined,
            status: status,
            priority: priority,
            description: description,
            notes: notes,
            lineItems: lineItems.map(li => ({
                id: li.id, description: li.description, qty: parseInt(li.qty), unit: li.unit, received: 0, priority: li.priority,
                isBoq: li.isBoq, boqItemId: li.boqItemId || undefined, nonBoqReason: li.nonBoqReason || undefined,
                clientApproval: li.clientApproval || false, trackCostImpact: li.trackCostImpact || false,
            })),
            comments: [],
            submittedAt: status === 'pending_approval' ? new Date().toISOString() : undefined
        };
    };

    const handleSubmit = () => {
        if (!selectedSite) { dispatch({ type: 'SHOW_TOAST', payload: { message: 'Site is required', type: 'error' } }); return; }
        if (!description.trim()) { dispatch({ type: 'SHOW_TOAST', payload: { message: 'Description is required', type: 'error' } }); return; }
        if (lineItems.some(li => !li.description.trim() || !li.qty)) { dispatch({ type: 'SHOW_TOAST', payload: { message: 'All line items must have description and quantity', type: 'error' } }); return; }
        if (lineItems.some(li => parseInt(li.qty) <= 0 || li.qty === '')) { dispatch({ type: 'SHOW_TOAST', payload: { message: 'All items must have a quantity of 1 or more', type: 'error' } }); return; }
        if (lineItems.some(li => !li.isBoq && !li.nonBoqReason.trim())) { dispatch({ type: 'SHOW_TOAST', payload: { message: 'Non-BOQ items require a reason', type: 'error' } }); return; }

        const newIndent = createIndentObject('pending_approval');
        dispatch({ type: 'CREATE_INDENT', payload: newIndent });
        dispatch({ type: 'SHOW_TOAST', payload: { message: 'Indent created successfully', type: 'success' } });
        window.location.hash = '#store-pending';
    };

    const handleSaveDraft = () => {
        if (!selectedSite) { dispatch({ type: 'SHOW_TOAST', payload: { message: 'Site is required', type: 'error' } }); return; }
        if (lineItems.some(li => !li.description.trim() || !li.qty)) { dispatch({ type: 'SHOW_TOAST', payload: { message: 'All line items must have description and quantity', type: 'error' } }); return; }
        if (lineItems.some(li => parseInt(li.qty) <= 0 || li.qty === '')) { dispatch({ type: 'SHOW_TOAST', payload: { message: 'All items must have a quantity of 1 or more', type: 'error' } }); return; }

        const newIndent = createIndentObject('draft');
        dispatch({ type: 'CREATE_INDENT', payload: newIndent });
        dispatch({ type: 'SHOW_TOAST', payload: { message: 'Draft saved', type: 'success' } });
        window.location.hash = '#store-pending';
    };

    return React.createElement('div', null,
        React.createElement('div', { className: 'card' },
            React.createElement('div', { className: 'card-header' },
                React.createElement('div', { className: 'card-title' }, 'Create New Indent')

                    }, userSites.length > 0 ? getSiteName(selectedSite, state.sites) : 'No site assigned')

                        onChange: (e) => setRequiredDate(e.target.value)
                    })
                ),
                React.createElement('div', { className: 'form-group' },
                    React.createElement('label', { className: 'form-label' }, 'Priority'),
                    React.createElement('select', {
                        className: 'form-select', value: priority,
                        onChange: (e) => setPriority(e.target.value)
                    },
                        React.createElement('option', { value: 'low' }, 'Low'),
                        React.createElement('option', { value: 'normal' }, 'Normal'),

function ReceiptEntryScreen({ indent, currentUserId }) {
    const [state, dispatch] = React.useContext(AppContext);
    const [receivingNow, setReceivingNow] = useState({});
    const [photoFile, setPhotoFile] = useState(null);
    const [photoPreview, setPhotoPreview] = useState(null);

    const handleReceivingNowChange = (lineItemId, value) => {
        const li = indent.lineItems.find(l => l.id === lineItemId);
        setReceivingNow({
            ...receivingNow,
            [lineItemId]: Math.min(parseInt(value) || 0, (li ? li.qty : 0) - (li ? li.received : 0))
        });
    };

    const handlePhotoChange = (e) => {
        const file = e.target.files[0];
        if (file) {
            setPhotoFile(file);
            const reader = new FileReader();
            reader.onload = (event) => { setPhotoPreview(event.target.result); };
            reader.readAsDataURL(file);
        }
    };

    const handleSaveReceipt = () => {
        const lineItemUpdates = {};
        let hasAnyReceived = false;

        indent.lineItems.forEach(li => {
            const newAmount = receivingNow[li.id] || 0;
            if (newAmount > 0) {
                lineItemUpdates[li.id] = li.received + newAmount;
                hasAnyReceived = true;
            } else {
                lineItemUpdates[li.id] = li.received;
            }
        });

        if (!hasAnyReceived) {
            dispatch({ type: 'SHOW_TOAST', payload: { message: 'Please receive at least one item', type: 'error' } });
            return;
        }

        dispatch({ type: 'RECEIVE_ITEMS', payload: { indentId: indent.id, lineItemUpdates } });

        const allFullyReceived = indent.lineItems.every(li => (lineItemUpdates[li.id] || li.received) >= li.qty);
        const message = allFullyReceived ? 'Receipt saved - Indent completed' : 'Receipt saved successfully';
        dispatch({ type: 'SHOW_TOAST', payload: { message, type: 'success' } });
        window.location.hash = '#store-pending';
    };

    return React.createElement('div', null,
        React.createElement('div', { className: 'card' },
            React.createElement('div', { className: 'card-header' },
                React.createElement('div', { className: 'card-title' }, 'Record Receipt for ' + indent.id)

                ),

                    React.createElement('div', { className: 'info-value' }, React.createElement(StatusBadge, { status: indent.status }))
                )
            )
        ),

        React.createElement('div', { className: 'card' },
            React.createElement('div', { className: 'card-header' },

            ),

                        React.createElement('th', null, 'Unit'),

                    )
                ),
                React.createElement('tbody', null,
                    indent.lineItems.map(li => {
                        const remaining = li.qty - li.received;
                        const receivingAmount = receivingNow[li.id] || 0;
                        return React.createElement('tr', { key: li.id },
                            React.createElement('td', null, li.description),

                            React.createElement('td', null, li.received),

function MaterialConsumptionReport() {
    const [state] = React.useContext(AppContext);
    const [siteFilter, setSiteFilter] = useState('');

    const completedIndents = state.indents.filter(i => {
        if (i.status !== 'completed') return false;
        if (siteFilter && i.siteId !== siteFilter) return false;
        return true;
    });

    const materialMap = {};
    completedIndents.forEach(indent => {
        indent.lineItems.forEach(li => {
            const key = li.description;
            if (!materialMap[key]) {
                materialMap[key] = { name: key, totalOrdered: 0, totalReceived: 0, unit: li.unit, indentCount: 0, indentIds: new Set() };
            }
            materialMap[key].totalOrdered += li.qty || 0;
            materialMap[key].totalReceived += li.received || 0;
            if (!materialMap[key].indentIds.has(indent.id)) {
                materialMap[key].indentIds.add(indent.id);
                materialMap[key].indentCount++;
            }
        });
    });

    const materials = Object.values(materialMap).sort((a, b) => b.totalOrdered - a.totalOrdered);

    return React.createElement('div', null,
        React.createElement('div', { style: { marginBottom: '16px', display: 'flex', gap: '12px', alignItems: 'center' } },

function IndentAgingReport() {

    const openIndents = state.indents
        .filter(i => !['completed', 'rejected'].includes(i.status))
        .map(i => {
            const daysSinceCreation = Math.floor((new Date() - new Date(i.createdAt)) / (1000 * 60 * 60 * 24));
            return { ...i, daysSinceCreation };
        })
        .sort((a, b) => b.daysSinceCreation - a.daysSinceCreation);

    const totalOpen = openIndents.length;
    const avgAge = totalOpen > 0
        ? Math.round(openIndents.reduce((sum, i) => sum + i.daysSinceCreation, 0) / totalOpen)

function App() {
    const [state, rawDispatch] = useReducer(appReducer, initialState);
    const route = useHashRoute();

    var dispatch = useCallback(function(action) {
        var entry = { ts: new Date().toISOString(), type: action.type, userId: state.currentUserId };
        if (action.payload && action.payload.indentId) entry.indentId = action.payload.indentId;
        if (action.payload && action.payload.poId) entry.poId = action.payload.poId;
        window.NC_MIS_LOG = window.NC_MIS_LOG || [];
        window.NC_MIS_LOG.push(entry);
        if (window.NC_MIS_LOG.length > 500) window.NC_MIS_LOG = window.NC_MIS_LOG.slice(-500);
        try { rawDispatch(action); } catch(e) {
            entry.error = e.message;
            console.error('[NC_MIS] Dispatch error:', e);
            throw e;
        }
    }, [state.currentUserId]);

    React.useEffect(function() {
        // Log navigation events
        var navEntry = { ts: new Date().toISOString(), type: 'NAVIGATE', userId: state.currentUserId, route: route };
        window.NC_MIS_LOG = window.NC_MIS_LOG || [];
        window.NC_MIS_LOG.push(navEntry);
        dispatch({ type: 'NAVIGATE', payload: route });
    }, [route]);

    React.useEffect(() => {
        if (state.toast) {
            const timer = setTimeout(() => dispatch({ type: 'HIDE_TOAST' }), 3000);
            return () => clearTimeout(timer);
        }

    const currentUser = state.users.find(u => u.id === state.currentUserId);

        return React.createElement(AppContext.Provider, { value: [state, dispatch] },

// ============================================================================
// 21. ERROR BOUNDARY
// ============================================================================

class ErrorBoundary extends React.Component {
    constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
    }
    static getDerivedStateFromError(error) {
        return { hasError: true, error };
    }
    componentDidCatch(error, info) {
        console.error('IndentFlow Error:', error, info);
        window.NC_MIS_LOG = window.NC_MIS_LOG || [];
        window.NC_MIS_LOG.push({
            ts: new Date().toISOString(),
            type: 'ERROR_BOUNDARY',
            error: error ? error.message : 'Unknown error',
            componentStack: info && info.componentStack ? info.componentStack.substring(0, 200) : '',
        });
    }
    render() {
        if (this.state.hasError) {
            return React.createElement('div', {
                style: { padding: '40px', textAlign: 'center', fontFamily: 'sans-serif' }
            },
                React.createElement('h2', { style: { color: '#dc2626' } }, 'Something went wrong'),
                React.createElement('p', { style: { color: '#666', marginTop: '10px' } },
                    this.state.error ? this.state.error.message : ''
                ),
                React.createElement('button', {
                    onClick: () => {
                        this.setState({ hasError: false });
                        window.location.hash = '#login';
                        window.location.reload();
                    },
                    style: {
                        marginTop: '20px', padding: '10px 20px',
                        background: '#2563eb', color: '#fff',
                        border: 'none', borderRadius: '6px', cursor: 'pointer'
                    }
                }, 'Reload App')
            );
        }
        return this.props.children;
    }
}

    var blob = new Blob([dataStr], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');

    a.download = 'nc_mis_logs_' + new Date().toISOString().slice(0, 10) + '.json';

};
